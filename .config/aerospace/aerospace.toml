# Config version for compatibility and deprecations
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 35

# Possible values: tiles|accordion
default-root-container-layout = "tiles"

# Possible values: horizontal|vertical|auto
default-root-container-orientation = "auto"

# Mouse lazily follows focused windows
on-focus-changed = ["move-mouse window-lazy-center"]

# Disable macOS application hiding
automatically-unhide-macos-hidden-apps = true

persistent-workspaces = [
  "1",
  "2",
  "3",
  "4",
  "5",
  "6",
  "7",
  "9",
  "F",
  "O",
  "P",
  "W",
  "M",
  "Z",
  "T",
  "B",
  "C",
  "N",
]

on-mode-changed = []

# This must remain before table declarations such as [key-mapping],
# [gaps], and [mode.main.binding].
on-window-detected = [
  { if = "test %{app-bundle-id} = com.apple.finder", run = "layout floating" },

  { if = "test %{app-bundle-id} = com.apple.findmy", run = [
    "move-node-to-workspace F",
    "layout floating",
  ] },

  { if = "test %{app-bundle-id} = com.apple.ActivityMonitor", run = "layout floating" },
  { if = "test %{app-bundle-id} = org.pqrs.Karabiner-Elements.Settings", run = "layout floating" },
  { if = "test %{app-bundle-id} = net.freemacsoft.AppCleaner", run = "layout floating" },
  { if = "test %{app-bundle-id} = com.apple.AppStore", run = "layout floating" },
  { if = "test %{app-bundle-id} = com.yubico.yubioath", run = "layout floating" },
  { if = "test %{app-bundle-id} = com.apple.Preview", run = "layout floating" },
  { if = "test %{app-bundle-id} = org.alacritty", run = "move-node-to-workspace 1" },
  { if = "test %{app-bundle-id} = app.zen-browser.zen", run = "move-node-to-workspace 2" },

  # Messages alternative:
  # { if = "test %{app-bundle-id} = com.apple.MobileSMS", run = [
  #   "layout floating",
  #   "move-node-to-workspace 4",
  # ] },

  { if = "test %{app-bundle-id} = com.apple.MobileSMS", run = [
    "move-node-to-workspace M",
    "move left",
    "resize smart -250",
  ] },

  { if = "test %{app-bundle-id} = com.spotify.client", run = "move-node-to-workspace M" },

  # { if = "test %{app-bundle-id} = net.sourceforge.skim-app.skim", run = "move-node-to-workspace 4" },

  { if = "test %{app-bundle-id} = info.sioyek.sioyek", run = "layout tiling" },
  { if = "test %{app-bundle-id} = com.apple.Safari", run = "move-node-to-workspace 5" },

  { if = "test %{app-bundle-id} = com.apple.Stickies", run = [
    "move-node-to-workspace 9",
    "layout floating",
  ] },

  { if = "test %{app-bundle-id} = com.apple.FaceTime", run = "layout floating" },
  { if = "test %{app-bundle-id} = com.apple.weather", run = "layout floating" },

  # { if = "test %{app-bundle-id} = com.microsoft.VSCode", run = "layout accordion horizontal" },

  { if = "test %{app-bundle-id} = org.zotero.zotero", run = "move-node-to-workspace Z" },
  { if = "test %{app-bundle-id} = dev.kdrag0n.MacVirt", run = "move-node-to-workspace O" },
  { if = "test %{app-bundle-id} = net.whatsapp.WhatsApp", run = "move-node-to-workspace W" },
  { if = "test %{app-bundle-id} = com.apple.QuickTimePlayerX", run = "layout floating" },
  { if = "test %{app-bundle-id} = ru.keepcoder.Telegram", run = "move-node-to-workspace T" },

  { if = "test %{app-bundle-id} = com.anthropic.claudefordesktop", run = [
    "move-node-to-workspace C",
    "layout h_accordion",
  ] },

  { if = "test %{app-bundle-id} = com.openai.codex", run = [
    "move-node-to-workspace C",
    "layout h_accordion",
  ] },

  { if = "test %{app-bundle-id} = com.conductor.app", run = "move-node-to-workspace C" },
  { if = "test %{app-bundle-id} = com.figma.Desktop", run = "move-node-to-workspace F" },
  { if = "test %{app-bundle-id} = com.tinyspeck.slackmacgap", run = "move-node-to-workspace 3" },
  { if = "test %{app-bundle-id} = com.linear", run = "move-node-to-workspace O" },
  { if = "test %{app-bundle-id} = notion.id", run = "move-node-to-workspace N" },

  { if = "test %{app-bundle-id} = com.apple.Passwords", run = "layout floating" },
]

# Possible values: qwerty|dvorak|colemak
[key-mapping]
preset = "qwerty"

[gaps]
inner.horizontal = 6
inner.vertical = 6
outer.left = 10
outer.bottom = 6
outer.top = 6
outer.right = 10

# Main binding mode
[mode.main.binding]
# Disable "Hide Others"
cmd-alt-h = []

# Focus
ctrl-alt-shift-cmd-h = "focus left --boundaries-action wrap-around-the-workspace"
ctrl-alt-shift-cmd-j = "focus down --boundaries-action wrap-around-the-workspace"
ctrl-alt-shift-cmd-k = "focus up --boundaries-action wrap-around-the-workspace"
ctrl-alt-shift-cmd-l = "focus right --boundaries-action wrap-around-the-workspace"

# Move
ctrl-alt-shift-h = "move left"
ctrl-alt-shift-j = "move down"
ctrl-alt-shift-k = "move up"
ctrl-alt-shift-l = "move right"

# Resize
ctrl-alt-shift-minus = "resize smart -50"
ctrl-alt-shift-equal = "resize smart +50"

# Switch workspace
ctrl-alt-shift-1 = "workspace 1"
ctrl-alt-shift-2 = "workspace 2"
ctrl-alt-shift-3 = "workspace 3"
ctrl-alt-shift-4 = "workspace 4"
ctrl-alt-shift-5 = "workspace 5"
ctrl-alt-shift-6 = "workspace 6"
ctrl-alt-shift-7 = "workspace 7"
ctrl-alt-shift-9 = "workspace 9"
ctrl-alt-shift-0 = "workspace 0"
ctrl-alt-shift-o = "workspace O"
ctrl-alt-shift-f = "workspace F"
ctrl-alt-shift-p = "workspace P"
ctrl-alt-shift-w = "workspace W"
ctrl-alt-shift-m = "workspace M"
ctrl-alt-shift-z = "workspace Z"
ctrl-alt-shift-t = "workspace T"
ctrl-alt-shift-b = "workspace B"
ctrl-alt-shift-c = "workspace C"
ctrl-alt-shift-n = "workspace N"

# Move window to workspace
ctrl-alt-shift-cmd-1 = "move-node-to-workspace 1"
ctrl-alt-shift-cmd-2 = "move-node-to-workspace 2"
ctrl-alt-shift-cmd-3 = "move-node-to-workspace 3"
ctrl-alt-shift-cmd-4 = "move-node-to-workspace 4"
ctrl-alt-shift-cmd-5 = "move-node-to-workspace 5"
ctrl-alt-shift-cmd-6 = "move-node-to-workspace 6"
ctrl-alt-shift-cmd-7 = "move-node-to-workspace 7"
ctrl-alt-shift-cmd-9 = "move-node-to-workspace 9"
ctrl-alt-shift-cmd-0 = "move-node-to-workspace 0"
ctrl-alt-shift-cmd-o = "move-node-to-workspace O"
ctrl-alt-shift-cmd-f = "move-node-to-workspace F"
ctrl-alt-shift-cmd-p = "move-node-to-workspace P"
ctrl-alt-shift-cmd-w = "move-node-to-workspace W"
ctrl-alt-shift-cmd-m = "move-node-to-workspace M"
ctrl-alt-shift-cmd-z = "move-node-to-workspace Z"
ctrl-alt-shift-cmd-t = "move-node-to-workspace T"
ctrl-alt-shift-cmd-b = "move-node-to-workspace B"
ctrl-alt-shift-cmd-c = "move-node-to-workspace C"
ctrl-alt-shift-cmd-n = "move-node-to-workspace N"

# Enter service mode
ctrl-alt-shift-semicolon = "mode service"
ctrl-alt-shift-comma = "layout tiles accordion"

# Service binding mode
[mode.service.binding]
esc = ["reload-config", "mode main"]
r = ["flatten-workspace-tree", "mode main"]

f = ["layout floating tiling", "mode main"]

enter = ["run-callback --for-every-window on-window-detected", "mode main"]

backspace = ["close-all-windows-but-current", "mode main"]

ctrl-alt-shift-h = ["join-with left", "mode main"]
ctrl-alt-shift-j = ["join-with down", "mode main"]
ctrl-alt-shift-k = ["join-with up", "mode main"]
ctrl-alt-shift-l = ["join-with right", "mode main"]
