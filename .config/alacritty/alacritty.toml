#:tombi schema.strict = false

# tombi complains about setting osc52
# just make sure you don't allow "paste" unless you really know what you're doing
[general]
# import = ["~/.config/alacritty/anysphere.toml"]
import = ["~/.config/alacritty/mellow.toml"]
# import = ["~/.config/alacritty/oldworld.toml"]
# import = ["~/.config/alacritty/oldtale.toml"]
live_config_reload = true

[window]
padding.x = 8
padding.y = 8
decorations = "buttonless"
dynamic_title = true
# opacity = 0.75
# blur = true

[font]
# For ss's
# size = 10

# MesloLGL typography
# size = 14
# offset = { x = 1, y = 0 }

# DankMono typography
# size = 20
# offset = { x = 0, y = 8 }
# glyph_offset = { x = 0, y = 2 }

# Hack typography
# size = 18
# offset = { x = 1, y = 13 }

# IoskeleyMono typography
# size = 18
# offset = { x = 0, y = 8 }
# glyph_offset = { x = 0, y = 0 }

# JetBrainsMono typography
size = 14
offset = { x = 0, y = 2 }
glyph_offset = { x = 0, y = 0 }

# FiraCode typography
# size = 16
# offset = { x = 1, y = 4 }
# glyph_offset = { x = 0, y = 0 }

# Suisse Int'l Mono
# size = 17
# offset = { x = 1, y = 2 }
# glyph_offset = { x = 0, y = 0 }

# GeistMono typography
# size = 16
# offset = { x = 0, y = 6 }
# glyph_offset = { x = 0, y = 0 }

# Space Mono typography
# size = 18
# offset = { x = 0, y = 0 }
# glyph_offset = { x = 0, y = 0 }

# BlexMono Typography
# size = 16
# offset = { x = 0, y = 3 }
# glyph_offset = { x = 0, y = 0 }

# GeistMono typography
# size = 16
# offset = { x = 1, y = 1 }

[font.normal]
# family = "GeistMono Nerd Font Propo"
# style = "Regular"

# family = "DankMono Nerd Font"

# family = "BlexMono Nerd Font"
# style = "Regular"

# family = "MesloLGL Nerd Font"
# style = "Regular"

# family = "Suisse Int'l Mono Trial"
# style = "Regular"

# family = "FiraCode Nerd Font"
# style = "Retina"
# style = "Regular"

# family = "SpaceMono Nerd Font"
# style = "Regular"

# family = "IoskeleyMono Nerd Font"
# style = "Regular"

# family = "Hack Nerd Font"

# family = "Maple Mono NF"
# style = "Regular"

# family = "MonoLisa"
# style = "MonoLisa"

family = "JetBrainsMono Nerd Font"
style = "Light"

# family = "CommitMono Nerd Font"
# style = "Regular"

# family = "CaskaydiaCove Nerd Font"
# style = "Regular"

# family = "SauceCodePro Nerd Font"
# style = "Medium"

# [colors.primary]
# background = "#131316"

[env]
TERM = "xterm-256color"
TERM_PROGRAM = "alacritty"
option_as_alt = "both"

[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001bb"  # ESC + b (backward word)

[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001bf"  # ESC + f (forward word)

[[keyboard.bindings]]
key = "Up"
mods = "Alt"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "Down"
mods = "Alt"
action = "ScrollPageDown"

[[keyboard.bindings]]
key = "M"
mods = "Command"
chars = "\u001bm"

# --- WezTerm-like "tabs" (tmux windows) ---
[[keyboard.bindings]]
key = "T"
mods = "Command"
chars = "\u0014"  # C-t

[[keyboard.bindings]]
key = "W"
mods = "Command"
chars = "\u0017"  # C-w

# ⌘ 1..⌘ 9/⌘ 0 -> M-1..M-0
[[keyboard.bindings]]
key = "Key1"
mods = "Command"
chars = "\u001b1"

[[keyboard.bindings]]
key = "Key2"
mods = "Command"
chars = "\u001b2"

[[keyboard.bindings]]
key = "Key3"
mods = "Command"
chars = "\u001b3"

[[keyboard.bindings]]
key = "Key4"
mods = "Command"
chars = "\u001b4"

[[keyboard.bindings]]
key = "Key5"
mods = "Command"
chars = "\u001b5"

[[keyboard.bindings]]
key = "Key6"
mods = "Command"
chars = "\u001b6"

[[keyboard.bindings]]
key = "Key7"
mods = "Command"
chars = "\u001b7"

[[keyboard.bindings]]
key = "Key8"
mods = "Command"
chars = "\u001b8"

[[keyboard.bindings]]
key = "Key9"
mods = "Command"
chars = "\u001b9"

[[keyboard.bindings]]
key = "Key0"
mods = "Command"
chars = "\u001b0"

# ⌘ ⇧ ] / ⌘ ⇧ [
# [[keyboard.bindings]]
# key = "]"
# mods = "Command|Shift"
# chars = "\u001bn"

# NOTE: This is mapping ⌘ [ -> M-p (ESC-p)
[[keyboard.bindings]]
key = "["
mods = "Command"
chars = "\u001bp"

# ⌘ H/J/K/L + U/D -> vim-aware navigation
[[keyboard.bindings]]
key = "H"
mods = "Command"
chars = "\u0008"  # C-h

[[keyboard.bindings]]
key = "J"
mods = "Command"
chars = "\u000A"  # C-j

[[keyboard.bindings]]
key = "K"
mods = "Command"
chars = "\u000B"  # C-k

[[keyboard.bindings]]
key = "L"
mods = "Command"
chars = "\u000C"  # C-l

[[keyboard.bindings]]
key = "U"
mods = "Command"
chars = "\u0015"  # C-u

[[keyboard.bindings]]
key = "D"
mods = "Command"
chars = "\u0004"  # C-d

# Session tree / reload / command prompt / detach
[[keyboard.bindings]]
key = "S"
mods = "Command"
chars = "\u001bs"

[[keyboard.bindings]]
key = "I"
mods = "Command"
chars = "\u001bi"

[[keyboard.bindings]]
key = "O"
mods = "Command"
chars = "\u001bo"

[[keyboard.bindings]]
key = "R"
mods = "Command"
chars = "\u001br"

[[keyboard.bindings]]
key = "Semicolon"
mods = "Command"
chars = "\u001b:"

# Map ⌘ ⇧ ctrl TAB -> M -
[[keyboard.bindings]]
key = "Tab"
mods = "Control|Alt|Shift"
chars = "\u001b,"  # M-,

# Deprecated tmux detach keybind
# [[keyboard.bindings]]
# key = "D"
# mods = "Command"
# chars = "\u001bd"

# New tmux detach keybind
[[keyboard.bindings]]
key = "X"
mods = "Command"
chars = "\u001bx"

# Splits (send M-\ and M--)
[[keyboard.bindings]]
key = "Backslash"
mods = "Command"
chars = "\u001b|"  # ESC + |

# Meta + MINUS + MINUS for ⌘ -
[[keyboard.bindings]]
key = "Minus"
mods = "Command"
chars = "\u001b-"

# TOP split (new): ⌘ ⇧ -
[[keyboard.bindings]]
key = "Minus"
mods = "Command|Shift"
chars = "\u001b_"

# Resizing with ⌘ ⇧ H/J/K/L (send M-H/J/K/L)
[[keyboard.bindings]]
key = "H"
mods = "Command|Shift"
chars = "\u001bH"

[[keyboard.bindings]]
key = "J"
mods = "Command|Shift"
chars = "\u001bJ"

[[keyboard.bindings]]
key = "K"
mods = "Command|Shift"
chars = "\u001bK"

[[keyboard.bindings]]
key = "L"
mods = "Command|Shift"
chars = "\u001bL"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b\r"

# Outside of tmux, send '__SUPER_S__' to open sesh fzf
# [[keyboard.bindings]]
# key = "S"
# mods = "Shift|Control|Alt"
# chars = "__SUPER_S__"

[[keyboard.bindings]]
key = "N"
mods = "Command"
chars = "\u001bn"

[[keyboard.bindings]]
key = "E"
mods = "Command"
chars = "\u001be"
